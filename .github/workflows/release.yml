name: Release HachiGen

on:
  push:
    branches:
      - main
    tags:
      - "hachigen-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "HachiGen release tag, for example hachigen-v1.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-hachigen:
    name: Build HachiGen
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || github.ref }}
          fetch-depth: 0

      - name: Resolve HachiGen release tag
        id: release
        shell: pwsh
        run: |
          $refType = "${{ github.ref_type }}"
          $refName = "${{ github.ref_name }}"
          $inputTag = "${{ github.event.inputs.tag }}"
          $before = "${{ github.event.before }}"
          $shouldRelease = "true"
          $tagPrefix = "hachigen-v"

          if ($inputTag) {
            $tag = $inputTag
            $version = $tag -replace "^$tagPrefix", ""
          } elseif ($refType -eq "tag") {
            $tag = $refName
            $version = $tag -replace "^$tagPrefix", ""
          } else {
            $package = Get-Content package.json -Raw | ConvertFrom-Json
            $version = [string]$package.version

            if (-not $version) {
              Write-Error "package.json does not define a version."
              exit 1
            }

            $tag = "$tagPrefix$version"
            $previousVersion = ""

            if ($before -and $before -notmatch "^0+$") {
              $previousPackageText = git show "$before`:package.json" 2>$null

              if ($LASTEXITCODE -eq 0 -and $previousPackageText) {
                $previousPackage = $previousPackageText | ConvertFrom-Json
                $previousVersion = [string]$previousPackage.version
              }
            }

            $tagMatches = @(git ls-remote --tags origin "refs/tags/$tag")

            if ($LASTEXITCODE -eq 0) {
              $tagExists = $tagMatches.Count -gt 0
            } else {
              Write-Error "Could not query remote tags."
              exit 1
            }

            if ($tagExists) {
              Write-Host "HachiGen release tag $tag already exists; skipping automatic release."
              $shouldRelease = "false"
            } elseif ($previousVersion -eq $version) {
              Write-Host "package.json version is still $version, but $tag does not exist; creating release for the current HachiGen version."
            } elseif ($previousVersion) {
              Write-Host "package.json version changed from $previousVersion to $version; creating $tag."
            } else {
              Write-Host "Could not read the previous package.json version; creating $tag because the tag does not exist."
            }
          }

          if ($tag -notmatch "^hachigen-v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$") {
            Write-Error "HachiGen release tag '$tag' must look like hachigen-v1.1.0."
            exit 1
          }

          if (-not $version) {
            $version = $tag -replace "^$tagPrefix", ""
          }

          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "release_title=HachiGen v$version" >> $env:GITHUB_OUTPUT
          "release_version=$version" >> $env:GITHUB_OUTPUT
          "should_release=$shouldRelease" >> $env:GITHUB_OUTPUT
          Write-Host "release_tag=$tag"
          Write-Host "release_title=HachiGen v$version"
          Write-Host "should_release=$shouldRelease"
          exit 0

      - name: Set up Node.js
        if: steps.release.outputs.should_release == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.release.outputs.should_release == 'true'
        run: npm ci

      - name: Run syntax check
        if: steps.release.outputs.should_release == 'true'
        run: npm run check

      - name: Run lint
        if: steps.release.outputs.should_release == 'true'
        run: npm run lint

      - name: Run smoke test
        if: steps.release.outputs.should_release == 'true'
        run: npm run smoke

      - name: Build HachiGen
        if: steps.release.outputs.should_release == 'true'
        env:
          WIN_CSC_KEY_PASSWORD: ${{ secrets.HACHIGEN_WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.HACHIGEN_WIN_CSC_LINK }}
        run: npm run dist

      - name: Run packaged UI smoke test
        if: steps.release.outputs.should_release == 'true'
        run: npm run smoke:packaged-ui

      - name: Generate release checksums
        if: steps.release.outputs.should_release == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          $assets = @(
            "dist/HachiGen-Setup-$env:RELEASE_VERSION.exe",
            "dist/HachiGen.exe"
          )
          $checksumPath = "dist/SHA256SUMS.txt"
          $lines = @()

          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) {
              Write-Error "Expected release asset was not built: $asset"
              exit 1
            }

            $hash = (Get-FileHash -Path $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = Split-Path $asset -Leaf
            $lines += "$hash  $name"
          }

          $lines | Set-Content -Path $checksumPath -Encoding ascii
          Get-Content $checksumPath

      - name: Create HachiGen release tag
        if: steps.release.outputs.should_release == 'true' && github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $env:RELEASE_TAG
          git push origin $env:RELEASE_TAG

      - name: Create or update GitHub release
        if: steps.release.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.release_title }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          $tag = $env:RELEASE_TAG
          $assets = @(
            "dist/HachiGen-Setup-$env:RELEASE_VERSION.exe",
            "dist/HachiGen.exe",
            "dist/SHA256SUMS.txt"
          )

          if (-not $tag) {
            Write-Error "Release tag was not provided."
            exit 1
          }

          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) {
              Write-Error "Expected release asset was not built: $asset"
              exit 1
            }
          }

          gh release view $tag *> $null

          if ($LASTEXITCODE -eq 0) {
            foreach ($asset in $assets) {
              gh release upload $tag $asset --clobber
              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
            }
            exit 0
          }

          gh release create $tag --title "$env:RELEASE_TITLE" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          foreach ($asset in $assets) {
            gh release upload $tag $asset --clobber
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          exit 0
